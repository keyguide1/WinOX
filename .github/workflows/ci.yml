name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/winox_ci
      SESSION_SECRET: ci-only-session-secret-that-is-at-least-32-characters
      REAL_MONEY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Run foundation tests
        run: npm test
      - name: Production build
        run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: winox
          POSTGRES_PASSWORD: winox
          POSTGRES_DB: winox_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U winox -d winox_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://winox:winox@localhost:5432/winox_ci
      SESSION_SECRET: ci-only-session-secret-that-is-at-least-32-characters
      REAL_MONEY_ENABLED: "false"
      RUN_DB_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply migrations to disposable PostgreSQL
        run: npm run db:migrate:deploy
      - name: Run PostgreSQL integration tests
        run: npm run test:integration
